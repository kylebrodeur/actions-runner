[project]
name = "actions-runner"
version = "0.1.1"
description = "Config-driven local runner for agentic pipeline stages: routes, five stage shapes, deterministic gates before token spend, and a worklog with artifacts."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["runner"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.ruff.lint.per-file-ignores]
"reference/**" = ["ALL"]  # reference material is adapted, not linted as kit code

[project.scripts]
arun = "runner.cli:main"